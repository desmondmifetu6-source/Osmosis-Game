<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle Results | Osmosis</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="core_styles.css">

  <style>
    :root {
      --gold:       #ffd700;
      --silver:     #e2e8f0;
      --bronze:     #f6ad55;
      --card-bg:    rgba(255, 255, 255, 0.05);
      --card-border:rgba(255, 255, 255, 0.12);
      --text-main:  #ffffff;
      --text-muted: rgba(255, 255, 255, 0.55);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0b0f19;
      font-family: 'Inter', sans-serif;
      color: var(--text-main);
      overflow-x: hidden;
    }

    .page-wrapper {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      padding: 3rem 1.2rem 5rem;
    }

    /* ─── Header ─── */
    .page-header {
      text-align: center;
      margin-bottom: 2.8rem;
      animation: fadeDown 0.6s ease-out both;
    }

    .header-trophy {
      font-size: 3.5rem;
      display: block;
      margin-bottom: 0.6rem;
      animation: floatY 3.2s ease-in-out infinite;
    }

    @keyframes floatY {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-7px); }
    }

    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 6vw, 3.4rem);
      font-weight: 900;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 6px;
      margin-bottom: 0.35rem;
    }

    .page-subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* ─── Cards List ─── */
    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      margin-bottom: 2.8rem;
    }

    /* ─── Slim Player Card ─── */
    .player-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 1rem;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 1.1rem 1.3rem;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      animation: cardIn 0.5s ease-out both;
    }

    .player-card:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .player-card:active { transform: scale(0.99); }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Rank color accents */
    .player-card.rank-1 {
      border-color: rgba(255, 215, 0, 0.4);
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%);
    }
    .player-card.rank-1:hover {
      border-color: rgba(255, 215, 0, 0.6);
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.12) 0%, rgba(255, 255, 255, 0.05) 100%);
    }
    .player-card.rank-2 {
      border-color: rgba(226, 232, 240, 0.25);
      background: linear-gradient(135deg, rgba(226, 232, 240, 0.06) 0%, rgba(255, 255, 255, 0.03) 100%);
    }
    .player-card.rank-3 {
      border-color: rgba(246, 173, 85, 0.25);
      background: linear-gradient(135deg, rgba(246, 173, 85, 0.06) 0%, rgba(255, 255, 255, 0.03) 100%);
    }

    /* Left accent bar */
    .player-card::before {
      content: '';
      position: absolute;
      left: 0; top: 16%; bottom: 16%;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--card-border);
    }
    .player-card.rank-1::before { background: var(--gold); }
    .player-card.rank-2::before { background: var(--silver); }
    .player-card.rank-3::before { background: var(--bronze); }

    /* ─── Rank Badge ─── */
    .rank-badge {
      flex-shrink: 0;
      width: 36px;
      text-align: center;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .rank-badge .rank-num { font-size: 1.05rem; font-weight: 900; color: var(--text-main); }
    .rank-1 .rank-badge .rank-num { color: var(--gold); }
    .rank-2 .rank-badge .rank-num { color: var(--silver); }
    .rank-3 .rank-badge .rank-num { color: var(--bronze); }
    .rank-badge .rank-medal { font-size: 1.2rem; line-height: 1; }

    /* ─── Avatar ─── */
    .card-avatar {
      flex-shrink: 0;
      font-size: 2rem;
      line-height: 1;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* ─── Player Info ─── */
    .card-info {
      flex: 1;
      min-width: 0;
    }

    .card-name {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .winner-tag {
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #000;
      background: var(--gold);
      border: none;
      padding: 2px 8px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .card-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .card-meta .meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ─── Score Block ─── */
    .card-score-block {
      flex-shrink: 0;
      text-align: right;
    }

    .card-score-val {
      font-size: 1.6rem;
      font-weight: 900;
      color: #fff;
      line-height: 1;
    }
    .rank-1 .card-score-val { color: var(--gold); }

    .card-score-label {
      font-size: 0.62rem;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 2px;
      font-weight: 700;
    }

    /* ─── Chevron ─── */
    .card-chevron {
      flex-shrink: 0;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-left: 2px;
      transition: transform 0.2s ease, color 0.2s ease;
    }
    .player-card:hover .card-chevron {
      transform: translateX(3px);
      color: rgba(255, 255, 255, 0.95);
    }

    /* ─── In-Progress indicator ─── */
    .in-progress-dot {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.67rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #4ade80;
    }
    .in-progress-dot::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      animation: blink 1.1s ease-in-out infinite;
      flex-shrink: 0;
    }

    /* ─── Words Modal ─── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 25000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
      -webkit-transform: translate3d(0,0,0);
      transform: translate3d(0,0,0);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 22px;
      width: 100%;
      max-width: 440px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      transform: translateY(22px) scale(0.96);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      -webkit-transform: translate3d(0, 22px, 0) scale(0.96);
    }
    .modal-overlay.active .modal-card {
      transform: translateY(0) scale(1);
      -webkit-transform: translate3d(0, 0, 0) scale(1);
    }

    .modal-top {
      padding: 1.6rem 1.6rem 1.2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
      position: relative;
    }

    .modal-x {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.7);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .modal-x:hover { background: rgba(255, 255, 255, 0.18); color: #fff; }

    .modal-avatar-wrap { font-size: 2.6rem; line-height: 1; flex-shrink: 0; }

    .modal-info { flex: 1; min-width: 0; }
    .modal-name { font-size: 1.2rem; font-weight: 800; color: #fff; }
    .modal-sublabel {
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .modal-body {
      padding: 1.2rem 1.4rem;
      overflow-y: auto;
      flex: 1;
    }

    .modal-word-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 3px solid var(--gold);
      border-radius: 12px;
      padding: 0.8rem 1rem;
      margin-bottom: 0.6rem;
      transition: background 0.2s;
    }
    .modal-word-row:hover { background: rgba(255, 255, 255, 0.08); }

    .modal-word-name {
      font-size: 0.88rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .modal-word-def {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.65);
      line-height: 1.5;
    }

    .modal-empty {
      text-align: center;
      color: var(--text-muted);
      font-style: italic;
      padding: 2.5rem 0;
      font-size: 0.9rem;
    }

    /* ─── Footer ─── */
    .page-footer {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .footer-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0.85rem 2rem;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: all 0.2s ease;
    }
    .footer-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }
    .footer-btn:active { transform: scale(0.97); }
    .footer-btn.primary {
      background: var(--gold);
      border-color: var(--gold);
      color: #000000;
    }
    .footer-btn.primary:hover {
      background: #ffe033;
      border-color: #ffe033;
    }

    /* ─── Animations ─── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .page-title { font-size: 1.9rem; letter-spacing: 3px; }
      .card-score-val { font-size: 1.3rem; }
      .card-avatar { width: 40px; height: 40px; font-size: 1.8rem; }
    }
  </style>
</head>

<body>
  <div class="page-wrapper">

    <!-- Header -->
    <header class="page-header">
      <span class="header-trophy">🏆</span>
      <h1 class="page-title">Battle Results</h1>
      <p class="page-subtitle">Final Standings</p>
    </header>

    <!-- Player Cards -->
    <div class="cards-list" id="cards-list">
      <!-- Injected by JS -->
    </div>

    <!-- Footer Buttons -->
    <div class="page-footer">
      <button class="footer-btn" id="mp-home-btn">🏠 Home</button>
      <button class="footer-btn primary" id="mp-play-btn">🔄 Play Again</button>
    </div>

  </div>

  <!-- Words Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-card">
      <div class="modal-top">
        <button class="modal-x" id="modal-x">✕</button>
        <div class="modal-avatar-wrap" id="modal-avatar">🤓</div>
        <div class="modal-info">
          <div class="modal-name" id="modal-name">Player</div>
          <div class="modal-sublabel">Words Learned</div>
        </div>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Words injected by JS -->
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="core_dictionary.js"></script>
  <script src="core_shared_state.js"></script>
  <script src="multiplayer_results.js"></script>
</body>
</html>
