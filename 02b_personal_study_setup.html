<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Osmosis - Personal Study</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="core_styles.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem 1rem;
      box-sizing: border-box;
    }

    .ps-card {
      max-width: 580px;
      width: 100%;
      margin: auto;
      padding: 2.5rem 2rem;
      background: rgba(255, 255, 255, 0.25) !important;
      backdrop-filter: blur(15px) !important;
      border: 1px solid rgba(255, 255, 255, 0.4) !important;
      border-radius: 24px !important;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15) !important;
    }

    .ps-title {
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 2px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      padding-bottom: 1rem;
      margin-bottom: 0.5rem;
    }

    .ps-subtitle {
      font-size: 0.92rem;
      color: var(--text-main);
      opacity: 0.8;
      margin-bottom: 1.8rem;
      font-weight: 500;
    }

    /* Search bar — identical to library */
    .search-bar-wrapper {
      position: relative;
      width: 100%;
      margin-bottom: 1.5rem;
    }

    .search-bar-wrapper input {
      width: 100%;
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.75);
      color: #1e293b;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .search-bar-wrapper input:focus {
      border-color: #f59e0b;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.18);
    }

    /* Autocomplete dropdown — same style as library */
    #ps-autocomplete-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 9999;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(28px) saturate(1.8);
      -webkit-backdrop-filter: blur(28px) saturate(1.8);
      border: 1.5px solid rgba(79, 70, 229, 0.25);
      border-radius: 14px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.2), 0 4px 12px rgba(79, 70, 229, 0.12);
      overflow: hidden;
      max-height: 320px;
      overflow-y: auto;
      animation: dropdownFadeIn 0.15s ease;
    }

    @keyframes dropdownFadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .ps-ac-item {
      padding: 11px 14px;
      cursor: pointer;
      border-bottom: 1px solid rgba(79, 70, 229, 0.07);
      border-left: 3px solid transparent;
      transition: background 0.13s ease, border-left-color 0.13s ease;
    }

    .ps-ac-item:last-child { border-bottom: none; }

    .ps-ac-item:hover {
      background: rgba(245, 158, 11, 0.1);
      border-left-color: #f59e0b;
    }

    .ps-ac-item .ac-word {
      font-size: 13px;
      font-weight: 800;
      color: #0f172a;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .ps-ac-item .ac-snippet {
      font-size: 11.5px;
      color: #475569;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    /* Selected words dock */
    .ps-deck-label {
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-main);
      opacity: 0.75;
      margin-bottom: 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ps-counter {
      font-size: 0.9rem;
      font-weight: 800;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      padding: 0.2rem 0.75rem;
      border-radius: 999px;
      letter-spacing: 0.5px;
      transition: background 0.3s;
    }

    .ps-counter.full {
      background: linear-gradient(135deg, #10b981, #059669);
    }

    .ps-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      min-height: 40px;
      align-items: center;
      background: rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 14px;
      padding: 0.7rem 0.9rem;
      margin-bottom: 1.8rem;
    }

    .ps-empty-hint {
      font-size: 0.85rem;
      color: var(--text-main);
      opacity: 0.5;
      font-style: italic;
      margin: 0;
    }

    .ps-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 0.35rem 0.75rem;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(245, 158, 11, 0.22);
      animation: chipIn 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes chipIn {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .ps-chip-remove {
      background: rgba(0,0,0,0.15);
      border: none;
      color: #fff;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      cursor: pointer;
      transition: background 0.2s;
      line-height: 1;
    }

    .ps-chip-remove:hover { background: rgba(220,38,38,0.7); }

    /* Buttons */
    .ps-btn-row {
      display: flex;
      gap: 1rem;
      justify-content: space-between;
    }

    .boss-btn {
      flex: 1;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      border: none;
      padding: 1.1rem 1.5rem;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 8px 22px rgba(245, 158, 11, 0.3);
    }

    .boss-btn:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 14px 30px rgba(245, 158, 11, 0.4);
      filter: brightness(1.08);
    }

    .boss-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .back-btn {
      background: rgba(255,255,255,0.4);
      border: 1.5px solid rgba(255,255,255,0.6);
      color: var(--text-main);
      padding: 1.1rem 1.4rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.65);
      transform: translateY(-2px);
    }

    @media (max-width: 480px) {
      .ps-card { padding: 2rem 1.25rem; }
      .ps-title { font-size: 1.5rem; }
      .ps-btn-row { flex-direction: column; }
    }

    /* Diagram Dropdown Badge / Indicator */
    .ps-ac-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .ps-diagram-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      padding: 3px 8px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(16, 185, 129, 0.3);
      transition: all 0.2s ease;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .ps-diagram-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.1);
      box-shadow: 0 4px 10px rgba(16, 185, 129, 0.45);
    }

    .ps-chip-diagram-btn {
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: all 0.2s ease;
    }

    .ps-chip-diagram-btn:hover {
      background: rgba(16, 185, 129, 0.9);
      border-color: #10b981;
      transform: scale(1.05);
    }

    .ps-def-btn {
      background: rgba(79, 70, 229, 0.12);
      border: 1px solid rgba(79, 70, 229, 0.35);
      color: #4338ca;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: all 0.2s ease;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .ps-def-btn:hover {
      background: #4f46e5;
      color: #ffffff;
      border-color: #4f46e5;
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.35);
    }

    .ps-chip-def-btn {
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: all 0.2s ease;
    }

    .ps-chip-def-btn:hover {
      background: rgba(79, 70, 229, 0.9);
      border-color: #4f46e5;
      transform: scale(1.05);
    }

    .ps-pronounce-mini-btn {
      background: rgba(0, 0, 0, 0.06);
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 0.75rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      transition: all 0.2s;
      line-height: 1;
    }

    .ps-pronounce-mini-btn:hover {
      background: #10b981;
      border-color: #10b981;
      color: #ffffff;
      transform: scale(1.08);
    }

    /* Full Diagram Viewer Modal */
    .ps-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 10000;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      box-sizing: border-box;
      animation: fadeIn 0.22s ease;
    }

    .ps-modal-overlay.active {
      display: flex;
    }

    .ps-diagram-card {
      background: rgba(255, 255, 255, 0.97);
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.6);
      max-width: 580px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2.2rem 2rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .ps-diagram-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.85rem;
      color: #1e293b;
      margin-bottom: 0.2rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      line-height: 1.2;
    }

    .ps-diagram-subtitle {
      font-size: 0.78rem;
      font-weight: 800;
      color: #4f46e5;
      text-transform: uppercase;
      letter-spacing: 1.8px;
      margin-bottom: 1.2rem;
      display: inline-block;
    }

    .ps-diagram-img-wrapper {
      width: 100%;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 16px;
      padding: 1.2rem;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.06);
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 1.2rem;
      box-sizing: border-box;
    }

    .ps-diagram-img {
      max-width: 100%;
      max-height: 380px;
      object-fit: contain;
      border-radius: 8px;
      display: block;
    }

    .ps-diagram-def {
      font-size: 0.93rem;
      color: #334155;
      line-height: 1.6;
      margin-bottom: 1.6rem;
      text-align: left;
      background: rgba(241, 245, 249, 0.85);
      padding: 1rem 1.2rem;
      border-radius: 12px;
      width: 100%;
      box-sizing: border-box;
      border-left: 4px solid #10b981;
    }

    @media (max-width: 520px) {
      .ps-card {
        padding: 1.2rem 0.9rem !important;
        border-radius: 20px !important;
      }
      .ps-title {
        font-size: 1.6rem;
      }
      .ps-subtitle {
        font-size: 0.85rem;
      }
      .ps-search-box input {
        font-size: 0.9rem;
        padding: 0.75rem 0.9rem;
      }
      .ps-btn-row {
        gap: 0.6rem;
      }
      .ps-btn-row button {
        padding: 0.8rem 1rem !important;
        font-size: 0.85rem !important;
      }
      .ps-diagram-card {
        padding: 1.2rem 0.9rem !important;
        max-height: 92vh;
      }
      .ps-diagram-title {
        font-size: 1.3rem !important;
      }
      .ps-diagram-img-wrapper {
        padding: 0.6rem;
      }
      .ps-diagram-img {
        max-height: 220px;
      }
      .ps-diagram-def {
        font-size: 0.82rem;
        padding: 0.8rem;
      }
    }
  </style>
</head>

<body class="dict-cover-page">
  <div class="dict-cover-bg" aria-hidden="true"></div>
  <div class="dict-cover-overlay" aria-hidden="true"></div>

  <div class="app-container">
    <div class="card ps-card">

      <h2 class="ps-title">📚 Personal Study</h2>
      <p class="ps-subtitle">Search the STEM dictionary and select up to <strong>5 words</strong> to build your custom study deck.</p>

      <!-- Search bar with live autocomplete -->
      <div class="search-bar-wrapper">
        <input type="text" id="ps-search-input" placeholder="Search a word..." autocomplete="off">
        <div id="ps-autocomplete-dropdown"></div>
      </div>

      <!-- Selected words dock -->
      <div class="ps-deck-label">
        <span>Your Deck</span>
        <span class="ps-counter" id="ps-counter">0 / 5</span>
      </div>
      <div class="ps-chips" id="ps-chips">
        <p class="ps-empty-hint" id="ps-empty-hint">No words selected yet — search above and click a word to add it.</p>
      </div>

      <!-- Action buttons -->
      <div class="ps-btn-row">
        <button class="back-btn" id="ps-back-btn">← Back</button>
        <button class="boss-btn" id="ps-begin-btn" disabled>Begin Study ▶</button>
      </div>

    </div>
  </div>

  <!-- Full Diagram Viewer Modal -->
  <div id="ps-diagram-modal" class="ps-modal-overlay">
    <div class="ps-diagram-card">
      <div style="display: flex; align-items: center; justify-content: center; gap: 0.6rem; margin-bottom: 0.2rem;">
        <h3 class="ps-diagram-title" id="ps-modal-word" style="margin: 0;">DIAGRAM</h3>
        <button type="button" id="ps-modal-pronounce-btn" class="ps-pronounce-mini-btn" style="font-size: 1rem; padding: 4px 8px;" title="Pronounce Word">🔊</button>
      </div>
      <span class="ps-diagram-subtitle">Osmosis STEM Diagram</span>
      <div class="ps-diagram-img-wrapper">
        <img id="ps-modal-img" class="ps-diagram-img" src="" alt="STEM Diagram">
      </div>
      <div class="ps-diagram-def" id="ps-modal-def"></div>
      <div style="display: flex; gap: 0.75rem; justify-content: center; width: 100%; flex-wrap: wrap;">
        <button type="button" id="ps-modal-read-def-btn" class="classic-btn" style="background: rgba(79, 70, 229, 0.15); color: #4338ca; border: 1.5px solid rgba(79, 70, 229, 0.35); margin-bottom: 0; width: auto; padding: 0.9rem 1.6rem; font-size: 0.9rem; border-radius: 12px;" title="Read definition aloud">📖 Read Aloud</button>
        <button type="button" id="ps-modal-back-btn" class="classic-btn green-gradient" style="margin-bottom: 0; width: auto; min-width: 160px; padding: 0.9rem 2rem; font-size: 0.9rem; border-radius: 12px;">← Back</button>
      </div>
    </div>
  </div>

  <script src="core_dictionary.js"></script>
  <script src="core_dictionary_diagrams.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="core_shared_state.js"></script>
  <script src="02b_personal_study_setup.js"></script>
</body>

</html>
