<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Osmosis - Stage 5: Meaning Exposure (Energy Zone)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="core_styles.css">
  <style>
    /* ============================================================
       STAGE 5 — Meaning Exposure / Energy Zone (Freed from the Box)
       ============================================================ */

    * { box-sizing: border-box; }

    body.stage5-page {
      background: linear-gradient(145deg, #dde3f8 0%, #ede5f8 45%, #d6eaf8 100%) !important;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, sans-serif;
      color: #1e1b4b;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ── Top Bar ─────────────────────────────────────────────── */
    .s5-topbar {
      width: 100%;
      max-width: 1024px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.4rem 1.6rem 0;
    }

    .s5-badge {
      background: #1e1b4b;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.55rem 1.3rem;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 14px rgba(30, 27, 75, 0.22);
      white-space: nowrap;
    }

    .s5-topbar-center {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      flex: 1;
      justify-content: center;
      padding: 0 1rem;
    }

    .s5-divider {
      height: 1.5px;
      width: 100px;
      background: rgba(99, 102, 241, 0.3);
      flex-shrink: 0;
    }

    .s5-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1e1b4b;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Main Stage Area ─────────────────────────────────────── */
    .s5-stage {
      width: 100%;
      max-width: 1024px;
      padding: 1.8rem 1.6rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    /* ── Transition Card (Energy Zone Welcome) ───────────────── */
    .s5-welcome-card {
      width: 100%;
      max-width: 820px;
      background: #ffffff;
      border-radius: 28px;
      padding: 3.5rem 3rem;
      box-shadow:
        0 4px 6px rgba(0, 0, 0, 0.03),
        0 20px 45px rgba(79, 70, 229, 0.08);
      border: 1px solid rgba(226, 232, 240, 0.85);
      text-align: center;
      margin: auto;
    }

    .s5-welcome-title {
      font-size: 2.6rem;
      font-weight: 800;
      color: #4f46e5;
      margin: 0 0 1.2rem;
      letter-spacing: -0.5px;
    }

    .s5-welcome-desc {
      font-size: 1.35rem;
      color: #475569;
      line-height: 1.8;
      margin: 0 auto 2.5rem;
      max-width: 620px;
      font-weight: 500;
    }

    .s5-btn-primary {
      padding: 1.25rem 3rem;
      border-radius: 999px;
      border: none;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.35);
      transition: all 0.25s ease;
    }

    .s5-btn-primary:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(79, 70, 229, 0.45);
    }

    /* ── Revision Container (Active Study Desk) ──────────────── */
    .s5-revision-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .s5-rev-header {
      width: 100%;
      background: #ffffff;
      border-radius: 20px;
      padding: 1.5rem 2.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(79, 70, 229, 0.05);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }

    .s5-rev-header h2 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 800;
      color: #1e1b4b;
    }

    .s5-rev-header p {
      margin: 0.3rem 0 0;
      font-size: 0.95rem;
      color: #64748b;
      font-weight: 500;
    }

    .alarming-timer {
      font-size: 1.5rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      background: #1e1b4b;
      color: #ffffff;
      padding: 0.55rem 1.4rem;
      border-radius: 999px;
      letter-spacing: 1.5px;
      box-shadow: 0 4px 14px rgba(30, 27, 75, 0.25);
    }

    /* ── Revision List ───────────────────────────────────────── */
    .revision-list {
      width: 100%;
      max-height: 60vh;
      overflow-y: auto;
      padding-right: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      scrollbar-width: thin;
      scrollbar-color: #a5b4fc transparent;
    }

    .revision-item {
      background: #ffffff;
      border-radius: 20px;
      padding: 1.8rem 2.2rem;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(226, 232, 240, 0.85);
      border-left: 6px solid #4f46e5;
      transition: all 0.2s ease;
    }

    .revision-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.08);
      border-left-color: #6366f1;
    }

    .rev-word-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .rev-word-header strong {
      font-size: 1.6rem;
      font-weight: 800;
      color: #1e1b4b;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .rev-audio-btns {
      display: inline-flex;
      gap: 0.5rem;
    }

    .rev-voice-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #334155;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .rev-voice-btn:hover {
      background: #e0e7ff;
      border-color: #818cf8;
      color: #312e81;
      transform: translateY(-1px);
    }

    .revision-def-text {
      margin: 0;
      font-size: 1.2rem;
      line-height: 1.8;
      color: #334155;
      font-weight: 400;
    }

    /* ── Bottom Controls ─────────────────────────────────────── */
    .s5-rev-actions {
      display: flex;
      justify-content: flex-end;
      width: 100%;
      padding-top: 0.5rem;
    }

    .s5-btn-secondary {
      padding: 1rem 2rem;
      border-radius: 14px;
      border: 1.5px solid rgba(148, 163, 184, 0.4);
      background: rgba(255, 255, 255, 0.85);
      color: #334155;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .s5-btn-secondary:hover {
      background: #ffffff;
      color: #0f172a;
      border-color: #6366f1;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(99, 102, 241, 0.15);
    }

    /* Suppress legacy global floating fixed timer */
    #global-game-timer {
      display: none !important;
    }

    /* ── Mobile & Responsive Spacing ───────────────────────── */
    @media (max-width: 640px) {
      .s5-topbar {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        padding: 0.85rem 1rem 0;
        gap: 0.6rem 0;
      }
      .s5-badge {
        font-size: 0.85rem;
        padding: 0.42rem 0.95rem;
      }
      .s5-topbar-center {
        order: 3;
        width: 100%;
        padding: 0.2rem 0 0;
        justify-content: center;
        gap: 0;
      }
      .s5-title {
        font-size: 0.95rem;
        text-align: center;
      }
      .s5-divider {
        display: none;
      }
      .s5-stage {
        padding: 1rem 1rem 2rem;
      }
      .s5-welcome-card {
        padding: 2.2rem 1.4rem;
        border-radius: 20px;
      }
      .s5-welcome-title {
        font-size: 2rem;
      }
      .s5-welcome-desc {
        font-size: 1.1rem;
        margin-bottom: 2rem;
      }
      .s5-btn-primary {
        width: 100%;
        padding: 1.1rem 1.5rem;
        font-size: 1.05rem;
      }
      .s5-rev-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.8rem;
        padding: 1.2rem 1.4rem;
      }
      .revision-item {
        padding: 1.2rem 1.4rem;
        border-radius: 16px;
      }
      .rev-word-header strong {
        font-size: 1.3rem;
      }
      .revision-def-text {
        font-size: 1.05rem;
        line-height: 1.7;
      }
      .s5-btn-secondary {
        width: 100%;
        text-align: center;
      }
    }

    @media (max-width: 380px) {
      .s5-topbar {
        padding: 0.75rem 0.6rem 0;
      }
      .s5-badge {
        font-size: 0.78rem;
        padding: 0.38rem 0.7rem;
      }
      .s5-title {
        font-size: 0.85rem;
      }
    }
  </style>
</head>

<body class="stage5-page">

  <!-- ── Top Bar ── -->
  <header class="s5-topbar">
    <div class="s5-badge">Score : <span id="current-score">0</span></div>

    <div class="s5-topbar-center">
      <span class="s5-divider"></span>
      <span class="s5-title">
        <span>⚡</span>
        Energy Zone: Meaning Assimilation
      </span>
      <span class="s5-divider"></span>
    </div>

    <div class="s5-badge">
      Time : <span id="timer-display">00:00</span>
    </div>
  </header>

  <!-- ── Main Stage Area ── -->
  <main class="s5-stage">

    <!-- Screen 1: Transition Curtain / Welcome -->
    <div id="transition-container" class="s5-welcome-card">
      <h1 class="s5-welcome-title">⚡ Energy Zone</h1>
      <p class="s5-welcome-desc">
        Take 5 dedicated minutes to absorb and assimilate all scientific terms and their definitions before testing.
      </p>
      <button id="start-btn" class="s5-btn-primary">Begin Study Session →</button>
    </div>

    <!-- Screen 2: Revision Library Desk -->
    <div id="revision-container" class="s5-revision-wrapper" style="display: none;">
      
      <div class="s5-rev-header">
        <div>
          <h2>Revision Desk</h2>
          <p>Read through each definition with deliberate focus.</p>
        </div>
        <div id="rev-timer" class="alarming-timer">05:00</div>
      </div>

      <!-- Scrolling Revision List -->
      <div id="rev-list" class="revision-list"></div>

      <!-- Actions -->
      <div class="s5-rev-actions">
        <button id="start-test-btn" class="s5-btn-secondary">End Study Early →</button>
      </div>

    </div>

  </main>

  <script src="core_dictionary.js"></script>
  <script src="core_formula_renderer.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="core_shared_state.js"></script>
  <script src="07_stage5_meaning_exposure.js"></script>
</body>

</html>
