<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Osmosis - Stage 3: Flash Recall</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=Roboto+Mono:wght@500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="core_styles.css">
  <style>
    /* ── Reset & Page Background ─────────────────────────────────────── */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      background: linear-gradient(145deg, #dde3f8 0%, #ede5f8 45%, #d6eaf8 100%);
      color: #1e1b4b;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem;
    }

    /* Suppress legacy floating timer */
    #global-game-timer {
      display: none !important;
    }

    .scoreboard {
      display: none !important;
    }

    /* ── Top Bar ──────────────────────────────────────────────────────── */
    .s3-topbar {
      width: 100%;
      max-width: 960px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.5rem 0.5rem 1.75rem;
    }

    .s3-badge {
      background: #1e1b4b;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.55rem 1.3rem;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 4px 12px rgba(30, 27, 75, 0.15);
      letter-spacing: 0.3px;
    }

    .s3-topbar-center {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
      justify-content: center;
    }

    .s3-divider {
      height: 1px;
      background: rgba(99, 102, 241, 0.25);
      flex: 1;
      max-width: 80px;
    }

    .s3-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #312e81;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    /* ── Main Stage Container ─────────────────────────────────────────── */
    .s3-stage {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── White Hero Cards ─────────────────────────────────────────────── */
    .s3-hero-card {
      width: 100%;
      background: #ffffff;
      border-radius: 26px;
      padding: 2.75rem 2.25rem;
      box-shadow: 0 20px 45px rgba(79, 70, 229, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 1px solid rgba(226, 232, 240, 0.9);
      position: relative;
    }

    /* ── Intro Card ───────────────────────────────────────────────────── */
    .s3-intro-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      display: inline-block;
      filter: drop-shadow(0 6px 12px rgba(245, 158, 11, 0.25));
    }

    .s3-intro-title {
      font-family: 'Outfit', sans-serif;
      font-size: 2.1rem;
      font-weight: 800;
      color: #1e1b4b;
      margin-bottom: 0.75rem;
      letter-spacing: -0.5px;
    }

    .s3-intro-desc {
      font-size: 1.08rem;
      color: #475569;
      line-height: 1.65;
      max-width: 540px;
      margin-bottom: 2rem;
    }

    /* ── Quiz Header Row ──────────────────────────────────────────────── */
    .s3-card-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 1.25rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #f1f5f9;
    }

    .s3-progress-pill {
      font-size: 0.88rem;
      font-weight: 700;
      color: #4338ca;
      background: #e0e7ff;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
    }

    .voice-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ecfdf5;
      border: 1.5px solid #a7f3d0;
      color: #065f46;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .voice-toggle-btn:hover {
      background: #d1fae5;
      transform: translateY(-1px);
    }

    .voice-toggle-btn.muted {
      background: #fef2f2;
      border-color: #fecaca;
      color: #991b1b;
    }

    /* ── Flash Presentation Zone ──────────────────────────────────────── */
    .flash-zone {
      width: 100%;
      min-height: 200px;
      background: linear-gradient(135deg, #f8faff 0%, #f1f5fd 100%);
      border: 2px dashed #c7d2fe;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 1.5rem;
      padding: 1.5rem;
    }

    .flash-word {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2.4rem, 6.5vw, 3.8rem);
      font-weight: 800;
      letter-spacing: clamp(2px, 0.5vw, 6px);
      text-transform: uppercase;
      color: #3730a3;
      transition: opacity 0.25s ease, transform 0.25s ease;
      word-break: break-word;
    }

    .flash-word.hidden {
      visibility: hidden;
      opacity: 0;
      transform: scale(0.92);
      pointer-events: none;
    }

    .replay-voice-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      transition: all 0.2s ease;
    }

    .replay-voice-btn:hover {
      transform: scale(1.08);
      background: #f8fafc;
    }

    .hint {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 1.5rem;
      font-weight: 500;
      min-height: 24px;
    }

    /* ── Sleek Input Field ────────────────────────────────────────────── */
    .word-input {
      width: 100%;
      max-width: 480px;
      font-family: 'Roboto Mono', monospace;
      font-size: 1.85rem;
      font-weight: 700;
      text-transform: uppercase;
      text-align: center;
      padding: 1rem 1.25rem;
      border-radius: 18px;
      background: #ffffff;
      border: 2px solid #cbd5e1;
      color: #1e1b4b;
      letter-spacing: 4px;
      outline: none;
      transition: all 0.25s ease;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
    }

    .word-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    .word-input.correct {
      border-color: #16a34a !important;
      background: #f0fdf4 !important;
      color: #14532d !important;
      box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.18) !important;
    }

    .word-input.wrong {
      border-color: #dc2626 !important;
      background: #fef2f2 !important;
      color: #991b1b !important;
      animation: s3shake 0.35s ease;
      box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.18) !important;
    }

    @keyframes s3shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-7px); }
      40%, 80% { transform: translateX(7px); }
    }

    /* ── Feedback Message ─────────────────────────────────────────────── */
    .feedback {
      font-size: 1rem;
      font-weight: 700;
      min-height: 32px;
      margin: 1.25rem 0 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .feedback.success {
      color: #16a34a;
    }

    .feedback.error {
      color: #dc2626;
    }

    /* ── Action Buttons ───────────────────────────────────────────────── */
    .s3-actions {
      display: flex;
      gap: 1rem;
      width: 100%;
      max-width: 480px;
      margin-top: 1rem;
      justify-content: center;
    }

    .s3-btn {
      width: 100%;
      padding: 0.95rem 1.75rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      letter-spacing: 0.2px;
    }

    .s3-btn-primary {
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
    }

    .s3-btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(79, 70, 229, 0.4);
    }

    .s3-btn-secondary {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
    }

    .s3-btn-secondary:hover {
      background: #e2e8f0;
    }

    /* ── Mobile Responsiveness ────────────────────────────────────────── */
    @media (max-width: 640px) {
      .s3-topbar {
        flex-wrap: wrap;
        padding-bottom: 1.25rem;
        gap: 0.6rem 0;
      }

      .s3-badge {
        font-size: 0.85rem;
        padding: 0.45rem 1rem;
      }

      .s3-topbar-center {
        order: 3;
        width: 100%;
        padding-top: 0.5rem;
      }

      .s3-hero-card {
        padding: 2rem 1.25rem;
        border-radius: 20px;
      }

      .word-input {
        font-size: 1.45rem;
        letter-spacing: 2.5px;
        padding: 0.85rem 1rem;
      }
    }
  </style>
</head>

<body>

  <!-- ── Top Bar ── -->
  <header class="s3-topbar">
    <div class="s3-badge">Score : <span id="current-score">0</span></div>

    <div class="s3-topbar-center">
      <span class="s3-divider"></span>
      <span class="s3-title">
        <span>⚡</span>
        Stage 3: Flash Recall
      </span>
      <span class="s3-divider"></span>
    </div>

    <div class="s3-badge">
      Time : <span id="timer-display">00:00</span>
    </div>
  </header>

  <!-- ── Main Stage Area ── -->
  <main class="s3-stage">

    <!-- Intro Card -->
    <div id="intro-container" class="s3-hero-card">
      <div class="s3-intro-icon">⚡</div>
      <h1 class="s3-intro-title">Flash Recall</h1>
      <p class="s3-intro-desc">
        A scientific term will flash for <strong>a split second</strong>, then vanish.
        Hold the visual imprint in your memory and type the exact word.
      </p>
      <button id="start-btn" class="s3-btn s3-btn-primary" style="max-width:320px;">
        Begin Flash Session →
      </button>
    </div>

    <!-- Active Quiz Card -->
    <div id="quiz-container" class="s3-hero-card" style="display:none;">
      <div class="s3-card-header">
        <div class="s3-progress-pill" id="quiz-progress">1 / 10</div>
        <button id="voice-toggle-btn" class="voice-toggle-btn" title="Toggle Voice Pronunciation">
          <span id="voice-toggle-icon">🔊</span>
          <span id="voice-toggle-label">Voice: ON</span>
        </button>
      </div>

      <div class="flash-zone">
        <div id="flash-word" class="flash-word">READY</div>
        <button id="replay-voice-btn" class="replay-voice-btn" title="Hear word again" style="display:none;">🔊</button>
      </div>

      <p id="flash-hint" class="hint">Memorize it...</p>

      <input type="text" id="typed-word-input" class="word-input" autocomplete="off" autocorrect="off"
        autocapitalize="off" spellcheck="false" placeholder="Type what you saw..." disabled>

      <div id="flash-feedback" class="feedback"></div>

      <div class="s3-actions">
        <button id="submit-btn" class="s3-btn s3-btn-primary" style="display:none;">Check Word</button>
        <button id="next-btn" class="s3-btn s3-btn-secondary" style="display:none;">Next Word →</button>
      </div>
    </div>

  </main>

  <script src="core_dictionary.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="core_shared_state.js"></script>
  <script src="05_stage3_flash_recall.js"></script>
</body>

</html>
