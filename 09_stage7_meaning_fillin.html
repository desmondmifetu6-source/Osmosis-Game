<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Osmosis - Stage 7: Definition Completion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="core_styles.css">
  <style>
    /* ============================================================
       STAGE 7 — Pixel-perfect match to Osmosis reference design
       ============================================================ */

    * { box-sizing: border-box; }

    body.stage7-page {
      background: linear-gradient(145deg, #dde3f8 0%, #ede5f8 45%, #d6eaf8 100%);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, sans-serif;
      color: #1e1b4b;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ── Top Bar ─────────────────────────────────────────────── */
    .s7-topbar {
      width: 100%;
      max-width: 1024px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.4rem 1.6rem 0;
    }

    .s7-badge {
      background: #1e1b4b;
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.55rem 1.3rem;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 14px rgba(30,27,75,.22);
      white-space: nowrap;
    }

    .s7-topbar-center {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      flex: 1;
      justify-content: center;
      padding: 0 1rem;
    }

    .s7-divider {
      height: 1.5px;
      width: 100px;
      background: rgba(99,102,241,.3);
      flex-shrink: 0;
    }

    .s7-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1e1b4b;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Main Stage Area ─────────────────────────────────────── */
    .s7-stage {
      width: 100%;
      max-width: 1024px;
      padding: 1.8rem 1.6rem 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4rem;
      flex: 1;
    }

    /* Word + sentence meta (small, subtle, above card) */
    .s7-meta {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.2rem;
    }

    .s7-word-label {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #5b52c7;
      opacity: 0.75;
    }

    .s7-progress-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #64748b;
    }

    /* ── Hero Sentence Card ───────────────────────────────────── */
    .s7-sentence-card {
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      padding: 2.8rem 3.2rem;
      box-shadow:
        0 2px 4px rgba(0,0,0,.03),
        0 12px 40px rgba(79,70,229,.07);
      border: 1px solid rgba(226,232,240,.8);

      /* Typography matching reference */
      font-size: 1.75rem;
      font-weight: 500;
      line-height: 2.1;
      color: #1e1b4b;
      text-align: left;
      word-break: break-word;
    }

    /* ── Inline Puzzle Slot (inside the sentence text) ───────── */
    .s7-slot {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #f1f0fe;
      border: 2px solid #c7c3f4;
      border-radius: 14px;
      padding: 0.28rem 1.2rem;
      margin: 0 0.35rem;
      color: #6366f1;
      font-size: 1.5rem;
      font-weight: 600;
      cursor: default;
      vertical-align: middle;
      min-width: 160px;
      justify-content: center;
      transition: all .22s ease;
      user-select: none;
    }

    .s7-slot .slot-icon { font-size: 1.1rem; }

    .s7-slot.filled {
      background: #e0e7ff;
      border-color: #818cf8;
      color: #312e81;
      font-weight: 700;
    }

    .s7-slot.correct {
      background: #dcfce7 !important;
      border-color: #16a34a !important;
      color: #14532d !important;
    }

    .s7-slot.wrong {
      background: #fee2e2 !important;
      border-color: #dc2626 !important;
      color: #7f1d1d !important;
      animation: s7shake .38s ease;
    }

    /* ── 2×2 Option Grid (OUTSIDE the card, below it) ────────── */
    .s7-options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      width: 100%;
    }

    .s7-option-btn {
      background: #ffffff;
      border: 2px solid #e8e8f0;
      border-radius: 999px;      /* full pill shape like reference */
      padding: 1.15rem 1.5rem;
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 600;
      color: #1e1b4b;
      cursor: pointer;
      text-align: center;
      transition: all .2s cubic-bezier(.175,.885,.32,1.275);
      box-shadow: 0 2px 10px rgba(0,0,0,.04);
      letter-spacing: 0.2px;
    }

    .s7-option-btn:hover:not(:disabled) {
      border-color: #6366f1;
      box-shadow: 0 6px 20px rgba(99,102,241,.18);
      transform: translateY(-2px);
    }

    .s7-option-btn.selected {
      background: #e0e7ff;
      border-color: #4f46e5;
      color: #312e81;
      box-shadow: 0 4px 16px rgba(79,70,229,.2);
    }

    .s7-option-btn.correct {
      background: #dcfce7 !important;
      border-color: #16a34a !important;
      color: #14532d !important;
      pointer-events: none;
    }

    .s7-option-btn.wrong-pick {
      background: #fee2e2 !important;
      border-color: #dc2626 !important;
      color: #7f1d1d !important;
    }

    .s7-option-btn:disabled,
    .s7-option-btn.dimmed {
      opacity: 0.38;
      cursor: not-allowed;
      transform: none !important;
      pointer-events: none;
    }

    /* ── Feedback Line ───────────────────────────────────────── */
    .s7-feedback {
      min-height: 1.8rem;
      font-size: 1.05rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.3px;
      transition: all .2s ease;
    }
    .s7-feedback.ok  { color: #15803d; }
    .s7-feedback.err { color: #b91c1c; }

    /* ── Bottom Action Row ───────────────────────────────────── */
    .s7-actions {
      display: flex;
      gap: 1rem;
      width: 100%;
    }

    .s7-btn {
      flex: 1;
      padding: 1.1rem 1.5rem;
      border-radius: 16px;
      border: none;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: all .22s ease;
    }

    .s7-btn-skip {
      background: rgba(255,255,255,.75);
      border: 1.5px solid rgba(148,163,184,.35);
      color: #64748b;
    }
    .s7-btn-skip:hover:not(:disabled) {
      background: #fff;
      color: #1e293b;
      transform: translateY(-1px);
    }

    .s7-btn-submit {
      background: linear-gradient(135deg, #4f46e5, #3b82f6);
      color: #fff;
      box-shadow: 0 8px 22px rgba(79,70,229,.35);
    }
    .s7-btn-submit:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-2px);
    }
    .s7-btn-submit.gold {
      background: linear-gradient(135deg, #f59e0b, #d97706) !important;
      box-shadow: 0 8px 25px rgba(245,158,11,.4) !important;
    }

    /* ── Animations ──────────────────────────────────────────── */
    @keyframes s7shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-6px); }
      75%      { transform: translateX(6px); }
    }

    @keyframes s7pop {
      0%   { transform: scale(.9); opacity:.7; }
      60%  { transform: scale(1.05); }
      100% { transform: scale(1); opacity:1; }
    }

    .floating-point {
      position: fixed;
      font-size: 1.1rem;
      font-weight: 800;
      color: #15803d;
      pointer-events: none;
      animation: s7pop .9s ease forwards;
      z-index: 999;
    }

    /* Suppress legacy global floating fixed timer */
    #global-game-timer {
      display: none !important;
    }

    /* ── Mobile & Responsive Spacing ───────────────────────── */
    @media (max-width: 640px) {
      .s7-topbar {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        padding: 0.85rem 1rem 0;
        gap: 0.6rem 0;
      }
      .s7-badge {
        font-size: 0.85rem;
        padding: 0.42rem 0.95rem;
      }
      .s7-topbar-center {
        order: 3;
        width: 100%;
        padding: 0.2rem 0 0;
        justify-content: center;
        gap: 0;
      }
      .s7-title {
        font-size: 0.95rem;
        text-align: center;
      }
      .s7-divider {
        display: none;
      }
      .s7-stage {
        padding: 1rem 1rem 2rem;
        gap: 1.1rem;
      }
      .s7-sentence-card {
        padding: 1.8rem 1.4rem;
        font-size: 1.25rem;
        line-height: 1.95;
        border-radius: 20px;
      }
      .s7-slot {
        font-size: 1.1rem;
        min-width: 120px;
        padding: 0.22rem 0.85rem;
      }
      .s7-options-grid {
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
      }
      .s7-option-btn {
        font-size: 1.02rem;
        padding: 0.95rem 0.75rem;
        border-radius: 999px;
      }
      .s7-actions {
        flex-direction: column;
        gap: 0.75rem;
      }
      .s7-btn {
        width: 100%;
        padding: 1rem 1.2rem;
        font-size: 1rem;
      }
    }

    @media (max-width: 380px) {
      .s7-topbar {
        padding: 0.75rem 0.6rem 0;
      }
      .s7-badge {
        font-size: 0.78rem;
        padding: 0.38rem 0.7rem;
      }
      .s7-title {
        font-size: 0.85rem;
      }
      .s7-options-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body class="stage7-page">

  <!-- ── Top Bar ── -->
  <header class="s7-topbar">
    <div class="s7-badge">Score : <span id="current-score">0</span></div>

    <div class="s7-topbar-center">
      <span class="s7-divider"></span>
      <span class="s7-title">
        <span>⚗️</span>
        Choose the correct word
      </span>
      <span class="s7-divider"></span>
    </div>

    <div class="s7-badge">
      Time : <span id="timer-display">00:00</span>
    </div>
  </header>

  <!-- ── Main Stage (hidden until JS bootstraps) ── -->
  <main class="s7-stage" id="test-container" style="display:none;">

    <!-- Hidden meta holders so JS DOM references remain valid -->
    <div class="s7-meta" style="display:none;">
      <span class="s7-word-label" id="test-word"></span>
      <span class="s7-progress-label" id="test-progress"></span>
    </div>

    <!-- The spacious hero sentence card -->
    <div class="s7-sentence-card" id="sentence-card">
      <!-- Sentence with inline puzzle slot injected here by JS -->
    </div>

    <!-- 2×2 option grid — pill buttons, OUTSIDE the card -->
    <div class="s7-options-grid" id="options-grid">
      <!-- Dynamically populated -->
    </div>

    <!-- Feedback line -->
    <div class="s7-feedback" id="test-feedback"></div>

    <!-- Skip / Submit actions -->
    <div class="s7-actions">
      <button id="skip-btn"   class="s7-btn s7-btn-skip">Skip / Forfeit (0 pts)</button>
      <button id="submit-btn" class="s7-btn s7-btn-submit">Submit Findings</button>
    </div>

  </main>

  <script src="core_dictionary.js"></script>
  <script src="core_distractor_engine.js"></script>
  <script src="core_formula_renderer.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="core_shared_state.js"></script>
  <script src="09_stage7_meaning_fillin.js"></script>
</body>

</html>
