<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Osmosis - Stage 6b: Definition Trick Dropdown</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="core_styles.css">
  <style>
    /* ============================================================
       STAGE 6b — Modern Dropdown Analysis (Freed from the Box)
       ============================================================ */

    * { box-sizing: border-box; }

    body.stage6b-page {
      background: linear-gradient(145deg, #dde3f8 0%, #ede5f8 45%, #d6eaf8 100%) !important;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, sans-serif;
      color: #1e1b4b;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ── Top Bar ─────────────────────────────────────────────── */
    .s6b-topbar {
      width: 100%;
      max-width: 1024px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.4rem 1.6rem 0;
    }

    .s6b-badge {
      background: #1e1b4b;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.55rem 1.3rem;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 14px rgba(30, 27, 75, 0.22);
      white-space: nowrap;
    }

    .s6b-topbar-center {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      flex: 1;
      justify-content: center;
      padding: 0 1rem;
    }

    .s6b-divider {
      height: 1.5px;
      width: 100px;
      background: rgba(99, 102, 241, 0.3);
      flex-shrink: 0;
    }

    .s6b-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1e1b4b;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Main Stage Area ─────────────────────────────────────── */
    .s6b-stage {
      width: 100%;
      max-width: 1024px;
      padding: 1.5rem 1.6rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    /* ── Loading Screen ──────────────────────────────────────── */
    .s6b-loading-card {
      width: 100%;
      max-width: 600px;
      background: #ffffff;
      border-radius: 24px;
      padding: 3.5rem 2rem;
      box-shadow: 0 12px 40px rgba(79, 70, 229, 0.07);
      border: 1px solid rgba(226, 232, 240, 0.85);
      text-align: center;
      margin: auto;
    }

    /* ── Hero Analysis Console ───────────────────────────────── */
    .s6b-hero-card {
      width: 100%;
      background: #ffffff;
      border-radius: 28px;
      padding: 3rem 3rem;
      box-shadow:
        0 4px 6px rgba(0, 0, 0, 0.03),
        0 20px 45px rgba(79, 70, 229, 0.08);
      border: 1px solid rgba(226, 232, 240, 0.85);
      display: flex;
      flex-direction: column;
      overflow: visible !important;
    }

    .s6b-meta-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
    }

    .s6b-meta-tag {
      font-size: 1.1rem;
      font-weight: 800;
      color: #4f46e5;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .s6b-progress-badge {
      font-size: 0.95rem;
      font-weight: 800;
      color: #475569;
      background: #f1f5f9;
      padding: 0.35rem 0.95rem;
      border-radius: 999px;
    }

    .highlight-word {
      font-size: 2.4rem;
      color: #1e1b4b;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin: 0 auto 1.5rem;
      font-weight: 800;
      border-bottom: 3px solid #4f46e5;
      padding-bottom: 0.4rem;
      display: inline-block;
    }

    .s6b-instruction {
      font-size: 1.1rem;
      color: #64748b;
      text-align: center;
      margin-bottom: 2rem;
      font-style: italic;
    }

    .meaning-fill-area {
      font-size: 1.65rem;
      line-height: 2.4;
      text-align: left;
      color: #1e1b4b;
      padding: 2.2rem;
      background: #f8fafc;
      border-radius: 20px;
      border: 1.5px solid #e2e8f0;
      overflow: visible !important;
      position: relative;
      margin-bottom: 1.5rem;
    }

    /* ── Custom Dropdown Pill ── */
    .custom-dropdown-container {
      display: inline-block;
      position: relative;
      margin: 0 0.35rem;
      vertical-align: middle;
      z-index: 10;
    }

    .custom-dropdown-container.open {
      z-index: 99999 !important;
    }

    .custom-dropdown-btn {
      font-size: 1.35rem;
      font-family: inherit;
      text-align: center;
      font-weight: 800;
      color: #4f46e5;
      border: 2px solid #a5b4fc;
      background: #ffffff;
      border-radius: 14px;
      padding: 0.25rem 1.1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.12);
      min-width: 140px;
      display: inline-flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .custom-dropdown-btn:hover {
      border-color: #6366f1;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.2);
    }

    .custom-dropdown-btn.filled {
      background: #e0e7ff;
      color: #312e81;
      border-color: #818cf8;
    }

    .custom-dropdown-btn.correct {
      background: #dcfce7 !important;
      border-color: #16a34a !important;
      color: #14532d !important;
      pointer-events: none;
    }

    .custom-dropdown-btn.wrong {
      background: #fee2e2 !important;
      border-color: #dc2626 !important;
      color: #7f1d1d !important;
      animation: s6bshake 0.4s ease;
    }

    .custom-dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%) translateY(-8px) scale(0.96);
      background: #ffffff !important;
      border: 2px solid #4f46e5 !important;
      border-radius: 16px !important;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.25) !important;
      min-width: 220px;
      width: max-content;
      max-width: 320px;
      z-index: 99999 !important;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), visibility 0.2s;
      overflow: hidden;
    }

    .custom-dropdown-container.open .custom-dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    .custom-option {
      padding: 12px 20px;
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e1b4b !important;
      cursor: pointer;
      text-align: center;
      border-bottom: 1px solid #f1f5f9;
      transition: all 0.15s ease;
      background: #ffffff;
    }

    .custom-option:last-child {
      border-bottom: none;
    }

    .custom-option:hover {
      background: #4f46e5 !important;
      color: #ffffff !important;
    }

    .dropdown-arrow {
      font-size: 0.7em;
      opacity: 0.8;
      transition: transform 0.25s ease;
    }

    .custom-dropdown-container.open .dropdown-arrow {
      transform: rotate(180deg);
    }

    /* ── Feedback & Actions ── */
    .feedback {
      min-height: 2.2rem;
      font-size: 1.2rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 1.2rem;
      letter-spacing: 0.3px;
    }

    .feedback.success { color: #15803d; }
    .feedback.error { color: #b91c1c; }

    .s6b-actions {
      display: flex;
      justify-content: space-between;
      gap: 1.2rem;
      width: 100%;
    }

    .s6b-btn {
      flex: 1;
      padding: 1.15rem 1.8rem;
      border-radius: 16px;
      border: none;
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.22s ease;
      text-align: center;
    }

    .s6b-btn-skip {
      background: rgba(255, 255, 255, 0.8);
      border: 1.5px solid rgba(148, 163, 184, 0.4);
      color: #475569;
    }

    .s6b-btn-skip:hover {
      background: #ffffff;
      color: #0f172a;
      transform: translateY(-2px);
    }

    .s6b-btn-submit {
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
      color: #ffffff;
      box-shadow: 0 8px 22px rgba(79, 70, 229, 0.35);
    }

    .s6b-btn-submit:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(79, 70, 229, 0.45);
    }

    .s6b-btn-submit.gold {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%) !important;
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.45) !important;
    }

    @keyframes s6bshake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .floating-point {
      position: fixed;
      color: #15803d;
      font-weight: 800;
      font-size: 1.4rem;
      pointer-events: none;
      animation: s6bpop 0.9s ease forwards;
      z-index: 99999;
    }

    @keyframes s6bpop {
      0% { transform: scale(0.9); opacity: 0.7; }
      60% { transform: scale(1.1); }
      100% { transform: translateY(-30px); opacity: 1; }
    }

    /* Suppress legacy global floating fixed timer */
    #global-game-timer {
      display: none !important;
    }

    /* ── Mobile & Responsive Spacing ───────────────────────── */
    @media (max-width: 640px) {
      .s6b-topbar {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        padding: 0.85rem 1rem 0;
        gap: 0.6rem 0;
      }
      .s6b-badge {
        font-size: 0.85rem;
        padding: 0.42rem 0.95rem;
      }
      .s6b-topbar-center {
        order: 3;
        width: 100%;
        padding: 0.2rem 0 0;
        justify-content: center;
        gap: 0;
      }
      .s6b-title {
        font-size: 0.95rem;
        text-align: center;
      }
      .s6b-divider {
        display: none;
      }
      .s6b-stage {
        padding: 1rem 1rem 2rem;
      }
      .s6b-hero-card {
        padding: 2rem 1.4rem;
        border-radius: 20px;
      }
      .highlight-word {
        font-size: 1.8rem;
        letter-spacing: 2px;
      }
      .meaning-fill-area {
        font-size: 1.25rem;
        line-height: 2.1;
        padding: 1.4rem;
      }
      .custom-dropdown-btn {
        font-size: 1.15rem;
        min-width: 110px;
        padding: 0.2rem 0.8rem;
      }
      .custom-dropdown-menu {
        min-width: 180px;
      }
      .custom-option {
        font-size: 1.1rem;
        padding: 10px 14px;
      }
      .s6b-actions {
        flex-direction: column;
        gap: 0.75rem;
      }
      .s6b-btn {
        width: 100%;
        padding: 1rem 1.2rem;
        font-size: 1rem;
      }
    }

    @media (max-width: 380px) {
      .s6b-topbar {
        padding: 0.75rem 0.6rem 0;
      }
      .s6b-badge {
        font-size: 0.78rem;
        padding: 0.38rem 0.7rem;
      }
      .s6b-title {
        font-size: 0.85rem;
      }
    }
  </style>
</head>

<body class="stage6b-page">

  <!-- ── Top Bar ── -->
  <header class="s6b-topbar">
    <div class="s6b-badge">Score : <span id="current-score">0</span></div>

    <div class="s6b-topbar-center">
      <span class="s6b-divider"></span>
      <span class="s6b-title">
        <span>🔍</span>
        Stage 6b: Missing Word Analysis
      </span>
      <span class="s6b-divider"></span>
    </div>

    <div class="s6b-badge">
      Time : <span id="timer-display">00:00</span>
    </div>
  </header>

  <!-- ── Main Stage Area ── -->
  <main class="s6b-stage">

    <div class="s6b-loading-card" id="loading-container">
      <h2 style="font-size: 1.6rem; font-weight: 800; color: #1e1b4b; margin: 0 0 1rem;">Preparing Stage 6b...</h2>
      <div style="margin: 1.5rem 0;"><span class="spinner"></span></div>
    </div>

    <!-- Active Dropdown Test Console -->
    <div id="test-container" class="s6b-hero-card" style="display: none;">
      
      <div class="s6b-meta-header">
        <span class="s6b-meta-tag">Definition Analysis</span>
        <span class="s6b-progress-badge" id="test-progress">1 / 10</span>
      </div>

      <p class="s6b-instruction">Select the correct words from the dropdown menus to complete the scientific definition.</p>

      <div style="text-align: center;">
        <h1 id="test-word" class="highlight-word">WORD</h1>
      </div>

      <!-- Content Area where the sentence with dropdowns appears -->
      <div id="test-meaning-container" class="meaning-fill-area"></div>

      <div id="test-feedback" class="feedback"></div>

      <div class="s6b-actions">
        <button id="skip-btn" class="s6b-btn s6b-btn-skip">Skip / Forfeit (0 pts)</button>
        <button id="submit-btn" class="s6b-btn s6b-btn-submit">Submit Findings</button>
      </div>

    </div>

  </main>

  <script src="core_dictionary.js"></script>
  <script src="core_distractor_engine.js"></script>
  <script src="core_formula_renderer.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="core_shared_state.js"></script>
  <script src="08b_stage6b_meaning_dropdown.js"></script>
</body>

</html>
