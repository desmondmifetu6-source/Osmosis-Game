<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Osmosis - Stage 6b: Definition Trick Dropdown</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="core_styles.css">
  <style>
    /* ─── Card & Page Containers (Ensure overflow: visible so dropdowns never clip) ─── */
    .stage6b-card {
      padding: 3rem 2.5rem;
      max-width: 800px;
      margin: auto;
      background: rgba(255, 255, 255, 0.35) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border: 2px solid rgba(255, 255, 255, 0.6) !important;
      border-radius: 24px !important;
      box-shadow: 0 20px 60px rgba(79, 70, 229, 0.18), 0 4px 16px rgba(0, 0, 0, 0.10) !important;
      overflow: visible !important;
      max-height: none !important;
    }

    .stage6b-scroll-inner {
      overflow: visible !important;
    }

    .s6b-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
    }

    .s6b-header h2 {
      margin: 0;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 1px;
    }

    .highlight-word {
      font-size: 3rem;
      color: var(--text-main);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 2.5rem;
      border-bottom: 3px solid var(--accent-primary);
      display: inline-block;
      padding-bottom: 0.5rem;
      font-weight: 800;
    }

    .meaning-fill-area {
      font-size: 1.6rem;
      line-height: 2.6;
      text-align: justify;
      color: var(--text-main);
      padding: 2rem;
      background: rgba(255, 255, 255, 0.45);
      border-radius: 20px;
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      overflow: visible !important;
      position: relative;
    }

    /* ─── Custom Dropdown Button (Interactive Pill) ─── */
    .custom-dropdown-container {
      display: inline-block;
      position: relative;
      margin: 0 0.4rem;
      vertical-align: middle;
      z-index: 10;
    }

    /* When open, elevate container to topmost z-index so it floats over subsequent text lines */
    .custom-dropdown-container.open {
      z-index: 99999 !important;
    }

    .custom-dropdown-btn {
      font-size: 1.45rem;
      font-family: inherit;
      text-align: center;
      font-weight: 800;
      color: #4F46E5;
      border: 2.5px solid #4F46E5;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 12px;
      padding: 0.2rem 1.2rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15);
      min-width: 140px;
      display: inline-flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .custom-dropdown-btn:hover {
      background: #FFFFFF;
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.28);
      transform: translateY(-1px);
    }

    .custom-dropdown-btn.filled {
      background: #FFFFFF;
      color: #1E1B4B;
      border-color: #4F46E5;
    }

    .custom-dropdown-btn.correct {
      background: #dcfce7 !important;
      border-color: #16a34a !important;
      color: #15803d !important;
      pointer-events: none;
    }

    .custom-dropdown-btn.wrong {
      background: #fee2e2 !important;
      border-color: #dc2626 !important;
      color: #b91c1c !important;
      animation: shake 0.4s ease;
    }

    /* ─── Ultra-Legible Frosted Glass Dropdown Menu ─── */
    .custom-dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%) translateY(-8px) scale(0.96);

      background: rgba(255, 255, 255, 0.96) !important;
      backdrop-filter: blur(24px) saturate(1.8) !important;
      -webkit-backdrop-filter: blur(24px) saturate(1.8) !important;

      border: 2px solid #4F46E5 !important;
      border-radius: 16px !important;
      box-shadow:
        0 20px 50px rgba(15, 23, 42, 0.3),
        0 0 0 4px rgba(79, 70, 229, 0.15) !important;

      min-width: 220px;
      width: max-content;
      max-width: 320px;
      z-index: 99999 !important;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), visibility 0.2s;
      overflow: hidden;
    }

    .custom-dropdown-container.open .custom-dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    /* ─── Menu Option Items ─── */
    .custom-option {
      padding: 14px 22px;
      font-size: 1.35rem;
      font-weight: 700;
      color: #1E1B4B !important; /* Deep dark indigo for 100% legibility */
      cursor: pointer;
      text-align: center;
      border-bottom: 1px solid rgba(79, 70, 229, 0.12);
      transition: all 0.15s ease;
      background: transparent;
    }

    .custom-option:last-child {
      border-bottom: none;
    }

    .custom-option:hover {
      background: #4F46E5 !important;
      color: #FFFFFF !important; /* Crisp white text on hover */
    }

    .dropdown-arrow {
      font-size: 0.7em;
      opacity: 0.8;
      transition: transform 0.25s ease;
    }

    .custom-dropdown-container.open .dropdown-arrow {
      transform: rotate(180deg);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .feedback {
      height: 2.5rem;
      font-weight: 700;
      margin-top: 1.5rem;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .feedback.success { color: #15803d; }
    .feedback.error { color: #b91c1c; }

    @media (max-width: 480px) {
      .stage6b-card { padding: 2rem 1.25rem; }
      .highlight-word { font-size: 2rem; }
      .meaning-fill-area { font-size: 1.2rem; line-height: 2.2; padding: 1.5rem; }
      .custom-dropdown-btn { font-size: 1.2rem; min-width: 110px; padding: 0.2rem 0.8rem; }
      .custom-dropdown-menu { min-width: 170px; }
      .custom-option { font-size: 1.1rem; padding: 12px 16px; }
    }

    .floating-point {
      position: fixed;
      color: #4caf50;
      font-weight: bold;
      font-family: monospace;
      font-size: 2rem;
      pointer-events: none;
      animation: floatUp 1s ease-out forwards;
      z-index: 99999;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.6);
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1.5); }
      100% { opacity: 0; transform: translateY(-60px) scale(1); }
    }
  </style>
</head>

<body>
  <div class="scoreboard" id="scoreboard">Score: <span id="current-score">0</span></div>
  <div class="app-container">

    <div class="card stage6b-card" id="loading-container">
      <h2 style="text-align:center;">Preparing Stage 6b...</h2>
      <div style="text-align:center;"><span class="spinner"></span></div>
    </div>

    <!-- Dropdown Test Container -->
    <div id="test-container" class="card stage6b-card parchment-large" style="display: none;">
      <!-- Scrollable inner wrapper — card itself stays overflow:visible so dropdowns aren't clipped -->
      <div class="stage6b-scroll-inner">
        <div class="s6b-header">
          <h2>Stage 6b: Missing Word Analysis</h2>
          <div id="test-progress" style="font-size:1.5rem; font-weight:bold;">1/10</div>
        </div>
        <p style="font-style:italic; margin-bottom:2rem; text-align:center;">Select the correct words from the dropdown menus to complete the definition.</p>

        <div style="text-align:center;">
          <h1 id="test-word" class="highlight-word">WORD</h1>
        </div>

        <!-- Content Area where the sentence with dropdowns will appear -->
        <div id="test-meaning-container" class="meaning-fill-area"></div>

        <div id="test-feedback" class="feedback" style="margin-top:2rem;"></div>

        <div style="display:flex; justify-content:space-between; margin-top:1rem;">
          <button id="skip-btn" class="classic-btn secondary" style="width:48%;">Skip / Forfeit (0 pts)</button>
          <button id="submit-btn" class="classic-btn blue-gradient" style="width:48%;">Submit Findings</button>
        </div>
      </div>
    </div>

  </div>
  <script src="core_dictionary.js"></script>
  <script src="core_formula_renderer.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="core_shared_state.js"></script>
  <script src="08b_stage6b_meaning_dropdown.js"></script>
</body>

</html>
